# fujiblst-a78.cfg -- FujiBlast on the Atari 7800: a SuperGame image with
# the cart's RAM (the claim's kind 5, flags 1) for the FujiNet 7800
# cartridge. 128K in eight 16K banks; the window at $8000-$BFFF takes banks
# 0-6, bank 7 sits at $C000 for good. See DESIGN.md.
#
#   banks 0-6   $8000-$9FFF  REPL: the same 8K in every one (linked into
#                            bank 0, copied to 1-6 by tools/atari7800/
#                            mkrom.py): the bombers' pixel pages and nothing
#                            else (MARIA reads it whichever bank is in)
#               $A000-$BFFF  bank 0: OVERLAY1 (code that doesn't fit below)
#                            bank 5: ART5 (text, big text, menu art, arena set 0)
#                            bank 6: ART6 (arena sets 1-3)
#   bank 7      $C000-$FF6F  the program, then the claim, the signature area
#                            and the vectors
#
# RAM: zero page $40-$FF; console RAM the display lists, DLL and DLI tables;
# the cart's 16K: $4000-$6BE7 the character blocks (A0-A3 or GFX+BIG, then
# the text font), the screen; the data from $6BE8, the C stack at the top.
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0300;
}
MEMORY {
    ZP:     file = "", start = $0040, size = $00C0, type = rw, define = yes;
    CONS1:  file = "", start = $1800, size = $0840, type = rw, define = yes;
    CONS2:  file = "", start = $2100, size = $0040, type = rw, define = yes;
    CONS3:  file = "", start = $2200, size = $0600, type = rw, define = yes;
    BLOCKS: file = "", start = $4000, size = $2BE8, type = rw, define = yes;
    CRAM:   file = "", start = $6BE8, size = $8000 - $6BE8 - __STACKSIZE__, type = rw, define = yes;
    CSTACK: file = "", start = $8000 - __STACKSIZE__, size = __STACKSIZE__, type = rw, define = yes;
    R0:     file = %O, start = $8000, size = $2000, fill = yes, fillval = $00, define = yes;
    B0:     file = %O, start = $A000, size = $2000, fill = yes, fillval = $FF, define = yes;
    R1:     file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B1:     file = %O, start = $A000, size = $2000, fill = yes, fillval = $FF;
    R2:     file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B2:     file = %O, start = $A000, size = $2000, fill = yes, fillval = $FF;
    R3:     file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B3:     file = %O, start = $A000, size = $2000, fill = yes, fillval = $FF;
    R4:     file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B4:     file = %O, start = $A000, size = $2000, fill = yes, fillval = $FF;
    R5:     file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B5:     file = %O, start = $A000, size = $2000, fill = yes, fillval = $FF, define = yes;
    R6:     file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B6:     file = %O, start = $A000, size = $2000, fill = yes, fillval = $FF, define = yes;
    FIXED:  file = %O, start = $C000, size = $3F70, fill = yes, fillval = $FF, define = yes;
    CLAIM:  file = %O, start = $FF70, size = $000A, fill = yes, fillval = $00;
    SIG:    file = %O, start = $FF7A, size = $007E, fill = yes, fillval = $FF;
    VECS:   file = %O, start = $FFF8, size = $0008;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    EXTZP:    load = ZP,     type = zp, optional = yes;
    DLSLOTS:  load = CONS1,  type = bss, define = yes;
    DLSLOTS2: load = CONS3,  type = bss, define = yes;
    CONSBSS:  load = CONS3,  type = bss, define = yes, optional = yes;
    CHARS:    load = BLOCKS, type = bss, define = yes, optional = yes;
    REPL:     load = R0,     type = ro, define = yes;
    OVERLAY1: load = B0,     type = ro, define = yes, optional = yes;
    OVL1RO:   load = B0,     type = ro, define = yes, optional = yes;
    ART5:     load = B5,     type = ro, define = yes;
    ART6:     load = B6,     type = ro, define = yes;
    STARTUP:  load = FIXED,  type = ro, define = yes;
    LOWCODE:  load = FIXED,  type = ro, optional = yes;
    ONCE:     load = FIXED,  type = ro, optional = yes;
    CODE:     load = FIXED,  type = ro, define = yes;
    RODATA:   load = FIXED,  type = ro, define = yes;
    DATA:     load = FIXED,  run = CRAM, type = rw, define = yes;
    BSS:      load = CRAM,   type = bss, define = yes;
    CLAIM:    load = CLAIM,  type = ro;
    VECTORS:  load = VECS,   type = ro;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
