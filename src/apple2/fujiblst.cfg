# FujiBlast (Apple II, 128K, double hi-res): a ProDOS program around both
# DHGR pages.
#
# Main RAM:
#   $0400-$07FF  text page 1, not shown: gfx.c keeps the rows' cells there
#   $0803-$1FFF  start-up, low code (the menus, appkeys, tests), data
#   $2000-$5FFF  DHGR pages 1 and 2, main halves (zeros in the file); in
#                the menus page 2's holds their code (overlay.c)
#   $6000-$BDFF  code, read-only data, BSS
#   $BE00-$BEFF  the C stack
#   $D400-$DFFF  the blitter (src/apple2/dhgr.s), in the language card
#                behind ProDOS's quit code; RAMRD/RAMWRT don't reach it
# Auxiliary RAM:
#   $2000-$5FFF  the DHGR pages' aux halves
#   $6000-...    the art and the blitter's tables, the Mockingboard's sounds,
#                the menus' overlay (FUJIBLST.GFX, loaded at start-up)

FEATURES {
    STARTADDRESS: default = $0803;
}
SYMBOLS {
    __EXEHDR__:    type = import;
    __FILETYPE__:  type = weak, value = $0006; # ProDOS file type
    __STACKSIZE__: type = weak, value = $0100; # C stack, $BE00-$BEFF (locals are static)
    __HIMEM__:     type = weak, value = $BF00; # below the ProDOS global page
    __LCADDR__:    type = weak, value = $D400; # behind quit code
    __LCSIZE__:    type = weak, value = $0C00; # rest of bank two
    __AUXGFX__:    type = export, value = $6000;
}
MEMORY {
    ZP:     file = "", define = yes, start = $0080,        size = $0070;
    HEADER: file = %O,               start = %S - $003A,   size = $003A;
    MAIN:   file = %O, define = yes, start = %S,           size = __HIMEM__ - __STACKSIZE__ - %S;
    BSS:    file = "",               start = __ONCE_RUN__, size = __HIMEM__ - __STACKSIZE__ - __ONCE_RUN__;
    LC:     file = "", define = yes, start = __LCADDR__,   size = __LCSIZE__;
    AUXG:   file = "%O.gfx", define = yes, start = __AUXGFX__, size = $C000 - __AUXGFX__;
    OVLW:   file = "",               start = $4000,        size = $2000;     # page 2's main half
}
SEGMENTS {
    ZEROPAGE: load = ZP,             type = zp;
    EXEHDR:   load = HEADER,         type = ro,  optional = yes;
    STARTUP:  load = MAIN,           type = ro;
    LOWCODE:  load = MAIN,           type = ro,  optional = yes;
    DATA:     load = MAIN,           type = rw;
    INIT:     load = MAIN,           type = rw;
    LOWDATA:  load = MAIN,           type = ro,  optional = yes;
    DHGRPAGES: load = MAIN,          type = rw,  start = $2000;     # 16K, src/apple2/pages.s
    CODE:     load = MAIN,           type = ro,  start = $6000;
    RODATA:   load = MAIN,           type = ro;
    ONCE:     load = MAIN,           type = ro,  define = yes;
    LC:       load = MAIN, run = LC, type = rw,  optional = yes;
    BSS:      load = BSS,            type = bss, define = yes;
    AUXGFX:   load = AUXG,           type = ro,  define = yes;
    AUXSND:   load = AUXG,           type = ro,  optional = yes;   # src/apple2/sndtab.s
    OVERLAY:  load = AUXG, run = OVLW, type = ro, define = yes;   # src/apple2/overlay.c
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
