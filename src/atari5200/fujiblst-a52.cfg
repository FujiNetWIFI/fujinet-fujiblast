# fujiblst-a52.cfg -- FujiBlast on the Atari 5200: a flat 32K cart for the
# FujiNet 5200 cartridge ($4000-$BFFF; the "FUJI" claim of kind 0 takes the
# size for the kind). Cart:
#
#   $4000-$AFFF  ROM:   the program, and the charsets' copy in the cart
#   $B000-$B7FF  ARENA: the cartridge's mailbox ($FF here; src/atari5200/
#                       nstrans.c, fn_tx and fn_regwr touch the hotspots)
#   $B800-$BFDF  ROM2:  more of the program
#   $BFE0-$BFFF  the claim and the BIOS's header (crt0.s)
#
# RAM, 16K (hw.inc and atari.h have the graphics' addresses; everything
# ANTIC reads is in RAM but the BIOS font at $F800):
#
#   $0000-$00FF  zero page: $00-$18 the crt0's shadows, $1D- cc65's and ours
#   $0200-$021B  the vectors
#   $021C-$13FF  DATA, BSS and the other variables
#   $1400-$17FF  the C stack
#   $1800-$1BE7  the screen: 25 rows x 40
#   $1C00-$1FFF  the menus' charset (logo, trophies)
#   $2000-$2FFF  the arena's four charsets (their animation frames)
#   $3000-$37FF  PMBASE's other copy (the players drawn twice over)
#   $3800-$3FFF  PMBASE: the display list, the row tables, the network frame
#                ($3800-$3AFF), missiles, players 0-3
FEATURES {
    STARTADDRESS: default = $4000;
}
SYMBOLS {
    __STACKSIZE__:       type = weak, value = $0400;
    __RESERVED_MEMORY__: type = weak, value = $0000;
}
MEMORY {
    ZP:      file = "", define = yes, start = $001D, size = $00E3, type = rw;
    RAM:     file = "", define = yes, start = $021C, size = $1800 - $021C - __STACKSIZE__, type = rw;
    STACK:   file = "", define = yes, start = $1800 - __STACKSIZE__, size = __STACKSIZE__, type = rw;
    MENUM:   file = "", define = yes, start = $1C00, size = $0400, type = rw;
    CHARM:   file = "", define = yes, start = $2000, size = $1000, type = rw;
    DLMEM:   file = "", start = $3800, size = $0060, type = rw;
    PMGFREE: file = "", start = $3860, size = $02A0, type = rw;

    ROM:     file = %O, define = yes, start = $4000, size = $7000, type = ro, fill = yes, fillval = $FF;
    ARENA:   file = %O, start = $B000, size = $0800, type = ro, fill = yes, fillval = $FF;
    ROM2:    file = %O, define = yes, start = $B800, size = $07E0, type = ro, fill = yes, fillval = $FF;
    CLAIM:   file = %O, start = $BFE0, size = $0008, type = ro, fill = yes, fillval = $00;
    HDR:     file = %O, start = $BFE8, size = $0018, type = ro;
}
SEGMENTS {
    ZEROPAGE: load = ZP,              type = zp;
    EXTZP:    load = ZP,              type = zp,  optional = yes;
    STARTUP:  load = ROM,             type = ro,  define = yes;
    LOWCODE:  load = ROM,             type = ro,  define = yes, optional = yes;
    ONCE:     load = ROM,             type = ro,  optional = yes;
    CODE:     load = ROM,             type = ro,  define = yes;
    RODATA:   load = ROM,             type = ro,  define = yes;
    DATA:     load = ROM, run = RAM,  type = rw,  define = yes;
    # the art ANTIC reads: the crt0 copies it into RAM
    CHARSETS: load = ROM,  run = CHARM, type = rw, define = yes;
    MENUCH:   load = ROM2, run = MENUM, type = rw, define = yes;
    ROM2:     load = ROM2,            type = ro,  optional = yes;
    BSS:      load = RAM,             type = bss, define = yes;
    LOWBSS:   load = RAM,             type = bss, optional = yes;
    BSS2:     load = RAM,             type = bss, optional = yes;
    INIT:     load = RAM,             type = bss, optional = yes;
    DLIST:    load = DLMEM,           type = bss;
    PMGFREE:  load = PMGFREE,         type = bss;
    CLAIM:    load = CLAIM,           type = ro;
    CARTHDR:  load = HDR,             type = ro;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
