# fujiblst-nes.cfg -- FujiBlast on the NES: an MMC3 image (mapper 4) for the
# FujiNet NES cartridge. 128K PRG in sixteen 8K banks, 16K CHR-RAM, 8K WRAM.
#
#   bank 0      ART at $8000 (R6, left there): the pattern sets and the
#               sprite patterns, copied into CHR-RAM at a screen's start;
#               CODE0 after it (the test scenes)
#   bank 7      CODE2 at $A000 (R7, never switched): more of the program
#   bank 14-15  $C000-$FFFF, fixed: the program, the claim ("FUJI" at
#               $FFF0, which keeps the cartridge's mailbox alive) and the
#               vectors
#
# RAM: zero page; $0200 the sprites (OAM DMA); $0300 the PPU queue;
# $0500-$07FF the C stack. The cart's WRAM at $6000 holds the data and the
# variables.
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0300;
}
MEMORY {
    ZP:     file = "", start = $0000, size = $0100, type = rw, define = yes;
    HEADER: file = %O, start = $0000, size = $0010, fill = yes;
    B0:     file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    PADA:   file = %O, start = $8000, size = $C000, fill = yes, fillval = $FF;
    B7:     file = %O, start = $A000, size = $2000, fill = yes, fillval = $FF;
    PAD:    file = %O, start = $8000, size = $C000, fill = yes, fillval = $FF;
    FIXED:  file = %O, start = $C000, size = $3FF0, fill = yes, fillval = $FF, define = yes;
    CLAIM:  file = %O, start = $FFF0, size = $000A, fill = yes, fillval = $FF;
    VECS:   file = %O, start = $FFFA, size = $0006, fill = yes;
    OAMRAM: file = "", start = $0200, size = $0100;
    QRAM:   file = "", start = $0300, size = $0100;
    SRAM:   file = "", start = $0500, size = __STACKSIZE__, define = yes;
    RAM:    file = "", start = $6000, size = $2000, define = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    HEADER:   load = HEADER, type = ro;
    ART:      load = B0,     type = ro, define = yes, optional = yes;
    CODE0:    load = B0,     type = ro, define = yes, optional = yes;
    CODE2:    load = B7,     type = ro, define = yes, optional = yes;
    STARTUP:  load = FIXED,  type = ro, define = yes;
    LOWCODE:  load = FIXED,  type = ro, optional = yes;
    ONCE:     load = FIXED,  type = ro, optional = yes;
    CODE:     load = FIXED,  type = ro, define = yes;
    RODATA:   load = FIXED,  type = ro, define = yes;
    DATA:     load = FIXED,  run = RAM, type = rw, define = yes;
    BSS:      load = RAM,    type = bss, define = yes;
    OAM:      load = OAMRAM, type = bss;
    PPUQ:     load = QRAM,   type = bss;
    CLAIM:    load = CLAIM,  type = ro;
    VECTORS:  load = VECS,   type = ro;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
