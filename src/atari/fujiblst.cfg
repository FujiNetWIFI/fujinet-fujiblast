# fujiblst.cfg -- FujiBlast on a 48K Atari 400/800 (and up).
#
#   $0480-$06FF  LOWBSS: variables (not loaded)
#   $0700-$09FF  picoboot and its sector buffer while loading, then BSS2
#   $0A00-       the program, then the C stack under the graphics
#   $9000-$9FFF  the arena's four charsets (their animation frames)
#   $A000-$A3FF  the menus' charset (logo, trophies)
#   $A400-$A7E7  the screen: 25 rows x 40
#   $B800-$BAFF  PMBASE's unused part: the display list, the row tables,
#                the network frame
#   $BB00-$BFFF  missiles, players 0-3
#
# The INIT chunk (src/atari/start.s) runs first: it switches BASIC off on an
# XL/XE, checks for 48K and blanks the screen while the rest loads.
FEATURES {
    STARTADDRESS: default = $0A00;
}
SYMBOLS {
    __STACKSIZE__:       type = weak, value = $0400;
    __STARTADDRESS__:    type = export, value = %S;
    __RESERVED_MEMORY__: type = weak, value = $0000;
    __GFX_START__:       type = export, value = $9000;
    __SYSCHKHDR__:       type = export, value = 0;
    __SYSCHKTRL__:       type = export, value = 0;
}
MEMORY {
    ZP:      file = "", define = yes, start = $0082, size = $007E;
    LOW:     file = "", define = yes, start = $0480, size = $0280;
    LOW2:    file = "", define = yes, start = $0700, size = $0300;
    START:   file = %O,               start = $2E00, size = $0100;
    MAIN:    file = %O, define = yes, start = %S,    size = __GFX_START__ - __STACKSIZE__ - %S;
    CHARS:   file = %O, define = yes, start = $9000, size = $1000;
    MENU:    file = %O, define = yes, start = $A000, size = $0400;
    DLMEM:   file = "",               start = $B800, size = $0060;
    PMGFREE: file = "",               start = $B860, size = $02A0;
}
FILES {
    %O: format = atari;
}
FORMATS {
    atari: runad = start,
           initad = START: fb_start;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    EXTZP:    load = ZP,     type = zp,               optional = yes;
    LOWBSS:   load = LOW,    type = bss,              optional = yes;
    BSS2:     load = LOW2,   type = bss,              optional = yes;
    FBSTART:  load = START,  type = ro;
    STARTUP:  load = MAIN,   type = ro,  define = yes;
    LOWCODE:  load = MAIN,   type = ro,  define = yes, optional = yes;
    ONCE:     load = MAIN,   type = ro,               optional = yes;
    CODE:     load = MAIN,   type = ro,  define = yes;
    RODATA:   load = MAIN,   type = ro;
    DATA:     load = MAIN,   type = rw;
    INIT:     load = MAIN,   type = bss, define = yes, optional = yes;
    BSS:      load = MAIN,   type = bss, define = yes;
    CHARSETS: load = CHARS,  type = ro;
    MENUCH:   load = MENU,   type = ro;
    DLIST:    load = DLMEM,  type = bss;
    PMGFREE:  load = PMGFREE, type = bss;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
